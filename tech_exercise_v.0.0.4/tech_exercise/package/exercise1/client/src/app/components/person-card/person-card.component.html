<a [routerLink]="['/view-person-details', person().name]" class="person-card">
  <div class="person-card__name">{{ person().name }}</div>
  <div class="person-card__meta">
    @if (person().currentDutyTitle || person().currentRank) {
      <span class="person-card__title">{{ person().currentDutyTitle || '—' }}</span>
      <span class="person-card__rank">{{ person().currentRank || '—' }}</span>
    } @else {
      <span class="person-card__no-duty">No current duty</span>
    }
  </div>
</a>
