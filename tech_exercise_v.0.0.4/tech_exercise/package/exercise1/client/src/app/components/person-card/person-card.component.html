<a [routerLink]="['/view-person-details', person().name]" class="person-card">
  <div class="person-card__name">{{ person().name }}</div>
  <div class="person-card__meta">
    @if (person().currentDutyTitle || person().currentRank) {
      <span class="person-card__title">{{ person().currentDutyTitle || '—' }}</span>
      <span class="person-card__stars" aria-label="Rank: {{ filledStars() }} of 5">
        @for (i of [1,2,3,4,5]; track i) {
          <span class="person-card__star" [class.person-card__star--filled]="i <= filledStars()">
            @if (i <= filledStars()) {
              <svg class="person-card__star-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            } @else {
              <svg class="person-card__star-svg person-card__star-svg--outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            }
          </span>
        }
      </span>
    } @else {
      <span class="person-card__no-duty">No current duty</span>
    }
  </div>
</a>
